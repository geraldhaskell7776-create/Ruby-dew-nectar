name: Deploy Fridge Photos web

on:
  push:
    branches: [main]
    paths:
      - 'fridge-photos-web/**'
      - '.github/workflows/deploy-fridge-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fridge-photos-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check date rules and build the photo manifest
        working-directory: fridge-photos-web
        run: |
          node tools/daterules.test.mjs
          node tools/build-manifest.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: fridge-photos-web

      - id: deploy
        uses: actions/deploy-pages@v4
