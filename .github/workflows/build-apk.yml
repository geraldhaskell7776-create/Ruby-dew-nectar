name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ruby-dew-nectar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ruby-dew-nectar-apk
          path: ruby-dew-nectar.apk

      # Publish the APK as a release so it has a direct download link
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Ruby Dew Nectar APK (latest)
          body: Tap ruby-dew-nectar.apk below to download and install.
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ruby-dew-nectar.apk
